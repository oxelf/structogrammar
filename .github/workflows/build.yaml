name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-linux-amd64:
    name: release linux/amd64
    env:
      CGO_ENABLED: 1
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: wangyoucao577/go-release-action@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        asset_name: "linux"
        project_path:  ./cli/
        goos: linux
        goarch: amd64
